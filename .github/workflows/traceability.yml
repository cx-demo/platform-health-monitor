name: Requirement Traceability

on: pull_request

permissions:
  contents: read

jobs:
  trace:
    name: Requirement Traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Requirement ID present in PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s %s' "$PR_TITLE" "$PR_BODY" | grep -qE 'SYS-[0-9]{4}'; then
            echo "::error::No requirement ID (SYS-NNNN) found in PR title or body"
            exit 1
          fi

      - name: Traceability matrix updated
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if ! git diff --name-only origin/${{ github.base_ref }}...HEAD \
               | grep -q 'docs/traceability-matrix.md'; then
            echo "::error::docs/traceability-matrix.md not updated"
            exit 1
          fi

      - name: Evidence present
        run: |
          test -n "$(ls -A docs/evidence/*.md 2>/dev/null)" \
            || { echo "::error::No evidence files in docs/evidence/"; exit 1; }
