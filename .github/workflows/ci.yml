name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit, integration and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/unit -v --junitxml=reports/unit.xml

      - name: Integration tests
        run: pytest tests/integration -v --junitxml=reports/integration.xml

      - name: ICD contract tests
        run: pytest tests/contract -v --junitxml=reports/contract.xml

      - name: Coverage gate
        run: pytest --cov=src --cov-report=term --cov-fail-under=90

      # SYS-4419: browser behaviour tests for the /dashboard fleet plate.
      # Python coverage does not measure browser-side code, so this suite
      # runs in addition to, not instead of, the gate above.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test runner
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser behaviour tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: reports/
