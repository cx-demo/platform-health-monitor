name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit, integration and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest tests/unit -v --junitxml=reports/unit.xml

      - name: Integration tests
        run: pytest tests/integration -v --junitxml=reports/integration.xml

      - name: ICD contract tests
        run: pytest tests/contract -v --junitxml=reports/contract.xml

      - name: Coverage gate
        run: pytest --cov=src --cov-report=term --cov-fail-under=90

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: reports/
